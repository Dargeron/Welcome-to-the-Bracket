name: "★ Vote on an encounter"
description: Rate an encounter from 1 to 10. Counted automatically.
title: "[Vote] "
labels: ["vote"]
body:
  - type: markdown
    attributes:
      value: |
        Once an encounter has **5 or more votes**, the median of **all** its votes is checked after every vote. If it is ever **under 5**, the encounter moves to the deprecated archive.
        Please vote as a reader, and not on your own entries.
  - type: input
    id: encounter
    attributes:
      label: Encounter ID
      placeholder: E0004
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Score (1–10)
      placeholder: "7"
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Comment (optional)
      description: A short review. Stored with your vote.
