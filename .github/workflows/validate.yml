# Checks pull requests: canon must stay consistent, drafts in submissions/
# must be acceptable, the rules engine tests must pass, and the site must build.
name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs
      - run: node scripts/validate.mjs --submissions
      - run: node scripts/build.mjs --out "$RUNNER_TEMP/site"
